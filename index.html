<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowTask — A calm to-do app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Subtle background -->
    <div class="app-bg" aria-hidden="true">
      <div class="bg-gradient"></div>
      <div class="bg-grid"></div>
      <div class="bg-blob bg-blob-1"></div>
      <div class="bg-blob bg-blob-2"></div>
    </div>

    <main class="app-main">
      <!-- Header -->
      <header class="app-header">
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect x="6" y="8" width="36" height="34" rx="9" fill="currentColor" opacity="0.12"/>
            <rect x="6" y="8" width="36" height="34" rx="9" stroke="currentColor" stroke-width="2"/>
            <path d="M16 25l5 5 10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1 class="brand-name">FlowTask</h1>
        </div>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="2" x2="12" y2="4"/>
              <line x1="12" y1="20" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="4" y2="12"/>
              <line x1="20" y1="12" x2="22" y2="12"/>
              <line x1="5.6" y1="5.6" x2="7.1" y2="7.1"/>
              <line x1="16.9" y1="16.9" x2="18.4" y2="18.4"/>
              <line x1="5.6" y1="18.4" x2="7.1" y2="16.9"/>
              <line x1="16.9" y1="7.1" x2="18.4" y2="5.6"/>
            </g>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/>
          </svg>
        </button>
      </header>

      <!-- Input section -->
      <section class="input-section" aria-label="Add new task">
        <div class="input-row">
          <div class="field">
            <label for="taskInput" class="sr-only">Task title</label>
            <input id="taskInput" type="text" placeholder="What needs to be done?" autocomplete="off" />
          </div>
          <div class="field">
            <label for="prioritySelect" class="sr-only">Priority</label>
            <select id="prioritySelect" title="Priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="dueDate" class="sr-only">Due date</label>
            <input id="dueDate" type="date" title="Due date" />
          </div>
          <button id="addBtn" class="btn-primary" aria-label="Add task">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <span>Add</span>
          </button>
        </div>
      </section>

      <!-- Filters -->
      <nav class="filters" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </nav>

      <!-- Task list -->
      <ul id="taskList" class="task-list" role="list">
        <!-- Tasks rendered here -->
      </ul>

      <!-- Empty state -->
      <div id="emptyState" class="empty-state" aria-hidden="true">
        <svg class="empty-illustration" viewBox="0 0 240 180" fill="none" aria-hidden="true">
          <rect x="40" y="30" width="160" height="120" rx="14" stroke="currentColor" stroke-width="2" fill="currentColor" opacity="0.06"/>
          <rect x="40" y="30" width="160" height="120" rx="14" stroke="currentColor" stroke-width="2"/>
          <line x1="70" y1="70" x2="100" y2="70" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <line x1="70" y1="92" x2="130" y2="92" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <line x1="70" y1="114" x2="120" y2="114" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="180" cy="50" r="8" fill="currentColor" opacity="0.5"/>
          <path d="M176 50l4 4 8-8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="190" cy="130" r="6" fill="currentColor" opacity="0.4"/>
          <path d="M187 130l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="50" cy="150" r="5" fill="currentColor" opacity="0.35"/>
        </svg>
        <p class="empty-text">No tasks yet — start fresh</p>
        <p class="empty-hint">Add a task above to get going</p>
      </div>

      <!-- Footer -->
      <footer class="app-footer">
        <span id="taskCount" class="task-count">0 tasks left</span>
        <button id="clearCompleted" class="btn-link" disabled>Clear completed</button>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
